<!DOCTYPE html>
<html>
<head>
    <title>Test QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <h2>Test QR Code for ASOPETS</h2>
    <div id="qr-container"></div>
    <div id="qr-data" style="margin-top: 20px; font-family: monospace; word-break: break-all;"></div>
    
    <script>
        // Create test pet profile data
        const testPetData = {
            type: "pet_profile",
            petId: "test-123",
            ownerId: "owner-456", 
            name: "Buddy",
            petName: "Buddy",
            category: "dog",
            breed: "Golden Retriever",
            dateOfBirth: "2020-05-15",
            age: 42,
            microchipId: "123456789012345",
            birthmarks: "Small brown spot on left ear",
            medicalRecordCount: 3,
            lastUpdated: "2025-06-26T15:00:00.000Z",
            owner: {
                name: "John Doe",
                email: "john@example.com",
                phone: "+1234567890"
            },
            timestamp: "2025-06-26T15:00:00.000Z"
        };
        
        const qrDataString = JSON.stringify(testPetData);
        
        // Display the data
        document.getElementById('qr-data').innerHTML = `
            <h3>QR Code Data:</h3>
            <pre>${qrDataString}</pre>
            <p><strong>Data Length:</strong> ${qrDataString.length} characters</p>
        `;
        
        // Generate QR code
        QRCode.toCanvas(qrDataString, { 
            width: 400,
            margin: 2,
            color: {
                dark: '#000000',
                light: '#FFFFFF'
            },
            errorCorrectionLevel: 'H'
        }, function (err, canvas) {
            if (err) {
                console.error('QR generation error:', err);
                document.getElementById('qr-container').innerHTML = 'Error generating QR code';
            } else {
                document.getElementById('qr-container').appendChild(canvas);
                console.log('QR code generated successfully');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>QR Validation Test</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <h2>QR Scanner Validation Test</h2>
    <div>
        <button onclick="runTest()">Run QR Detection Test</button>
        <div id="results"></div>
        <canvas id="testCanvas" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    </div>

    <script>
        const testPetData = {
            type: "pet_profile",
            petId: "test-123",
            ownerId: "owner-456",
            name: "Test Pet",
            petName: "Test Pet",
            category: "dog",
            breed: "Golden Retriever",
            dateOfBirth: "2020-05-15",
            age: 42,
            microchipId: "123456789012345",
            medicalRecordCount: 3,
            owner: {
                name: "John Doe",
                email: "john@example.com",
                phone: "+1234567890"
            }
        };

        async function runTest() {
            const results = document.getElementById('results');
            const canvas = document.getElementById('testCanvas');
            const ctx = canvas.getContext('2d');
            
            results.innerHTML = '<p>Starting QR validation test...</p>';
            
            try {
                // Generate QR code
                const qrDataString = JSON.stringify(testPetData);
                console.log('Test data:', qrDataString);
                console.log('Data length:', qrDataString.length);
                
                // Create QR code on canvas
                await QRCode.toCanvas(canvas, qrDataString, {
                    width: 300,
                    margin: 2,
                    color: { dark: '#000000', light: '#FFFFFF' },
                    errorCorrectionLevel: 'H'
                });
                
                results.innerHTML += '<p>✓ QR code generated successfully</p>';
                
                // Test detection
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                console.log('Canvas size:', canvas.width, 'x', canvas.height);
                console.log('Image data length:', imageData.data.length);
                
                // Test multiple detection strategies
                const strategies = [
                    { name: 'dontInvert', options: { inversionAttempts: 'dontInvert' } },
                    { name: 'onlyInvert', options: { inversionAttempts: 'onlyInvert' } },
                    { name: 'attemptBoth', options: { inversionAttempts: 'attemptBoth' } }
                ];
                
                let detected = false;
                for (const strategy of strategies) {
                    console.log(`Testing strategy: ${strategy.name}`);
                    
                    const code = jsQR(imageData.data, imageData.width, imageData.height, strategy.options);
                    
                    if (code) {
                        console.log(`✓ Detection successful with ${strategy.name}`);
                        console.log('Detected data:', code.data.substring(0, 100));
                        
                        try {
                            const parsedData = JSON.parse(code.data);
                            console.log('Parsed data:', parsedData);
                            
                            if (parsedData.type === 'pet_profile' && parsedData.petId) {
                                results.innerHTML += `<p>✓ Detection successful with ${strategy.name}</p>`;
                                results.innerHTML += `<p>✓ Valid pet profile detected: ${parsedData.name}</p>`;
                                detected = true;
                                break;
                            }
                        } catch (parseError) {
                            console.error('Parse error:', parseError);
                        }
                    } else {
                        console.log(`✗ No detection with ${strategy.name}`);
                    }
                }
                
                if (!detected) {
                    results.innerHTML += '<p>✗ QR detection failed with all strategies</p>';
                }
                
            } catch (error) {
                console.error('Test error:', error);
                results.innerHTML += `<p>✗ Test failed: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>QR Scanner Test</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        #results { margin: 20px 0; }
        canvas { border: 1px solid #ddd; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>QR Scanner Detection Test</h1>
    
    <div class="test-section">
        <h2>Test 1: QR Generation and Detection</h2>
        <button onclick="runDetectionTest()">Run Detection Test</button>
        <div id="test1-results"></div>
        <canvas id="test1-canvas" width="300" height="300"></canvas>
    </div>

    <div class="test-section">
        <h2>Test 2: Multi-Strategy Detection</h2>
        <button onclick="runMultiStrategyTest()">Run Multi-Strategy Test</button>
        <div id="test2-results"></div>
        <canvas id="test2-canvas" width="300" height="300"></canvas>
    </div>

    <div class="test-section">
        <h2>Test 3: Enhanced Processing</h2>
        <button onclick="runEnhancedTest()">Run Enhanced Processing Test</button>
        <div id="test3-results"></div>
        <canvas id="test3-canvas" width="300" height="300"></canvas>
    </div>

    <script>
        // Test pet data matching ASOPETS format
        const testPetData = {
            type: "pet_profile",
            petId: "test-123",
            ownerId: "owner-456",
            name: "Buddy",
            petName: "Buddy",
            category: "dog",
            breed: "Golden Retriever",
            age: 24,
            medicalRecordCount: 3,
            owner: {
                name: "Test Owner",
                email: "test@example.com",
                phone: "+1234567890"
            }
        };

        function log(testId, message, type = 'info') {
            const results = document.getElementById(`${testId}-results`);
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            results.innerHTML += `<div class="${className}">${message}</div>`;
            console.log(`[${testId}] ${message}`);
        }

        async function runDetectionTest() {
            const testId = 'test1';
            const canvas = document.getElementById(`${testId}-canvas`);
            const ctx = canvas.getContext('2d');
            
            document.getElementById(`${testId}-results`).innerHTML = '';
            log(testId, 'Starting basic QR detection test...');
            
            try {
                const qrDataString = JSON.stringify(testPetData);
                log(testId, `Generated test data: ${qrDataString.length} characters`);
                
                // Generate QR code
                await QRCode.toCanvas(canvas, qrDataString, {
                    width: 300,
                    margin: 2,
                    errorCorrectionLevel: 'H'
                });
                
                log(testId, 'QR code generated successfully', 'success');
                
                // Test detection
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                
                if (code) {
                    log(testId, `QR detected! Data length: ${code.data.length}`, 'success');
                    
                    try {
                        const parsed = JSON.parse(code.data);
                        if (parsed.type === 'pet_profile' && parsed.petId) {
                            log(testId, `Valid pet profile detected: ${parsed.name}`, 'success');
                            return true;
                        } else {
                            log(testId, 'Invalid pet profile format', 'error');
                        }
                    } catch (e) {
                        log(testId, 'JSON parsing failed', 'error');
                    }
                } else {
                    log(testId, 'No QR code detected', 'error');
                }
            } catch (error) {
                log(testId, `Test failed: ${error.message}`, 'error');
            }
            
            return false;
        }

        async function runMultiStrategyTest() {
            const testId = 'test2';
            const canvas = document.getElementById(`${testId}-canvas`);
            const ctx = canvas.getContext('2d');
            
            document.getElementById(`${testId}-results`).innerHTML = '';
            log(testId, 'Starting multi-strategy detection test...');
            
            try {
                const qrDataString = JSON.stringify(testPetData);
                
                // Generate QR code
                await QRCode.toCanvas(canvas, qrDataString, {
                    width: 300,
                    margin: 2,
                    errorCorrectionLevel: 'H'
                });
                
                log(testId, 'QR code generated, testing detection strategies...');
                
                // Test multiple strategies like our enhanced scanner
                const strategies = [
                    { name: 'dontInvert', options: { inversionAttempts: 'dontInvert' } },
                    { name: 'onlyInvert', options: { inversionAttempts: 'onlyInvert' } },
                    { name: 'attemptBoth', options: { inversionAttempts: 'attemptBoth' } }
                ];
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let successCount = 0;
                
                for (const strategy of strategies) {
                    const code = jsQR(imageData.data, imageData.width, imageData.height, strategy.options);
                    
                    if (code) {
                        log(testId, `Strategy '${strategy.name}' succeeded`, 'success');
                        successCount++;
                    } else {
                        log(testId, `Strategy '${strategy.name}' failed`, 'error');
                    }
                }
                
                log(testId, `Multi-strategy test complete: ${successCount}/3 strategies succeeded`, 
                    successCount > 0 ? 'success' : 'error');
                
                return successCount > 0;
                
            } catch (error) {
                log(testId, `Multi-strategy test failed: ${error.message}`, 'error');
            }
            
            return false;
        }

        async function runEnhancedTest() {
            const testId = 'test3';
            const canvas = document.getElementById(`${testId}-canvas`);
            const ctx = canvas.getContext('2d');
            
            document.getElementById(`${testId}-results`).innerHTML = '';
            log(testId, 'Starting enhanced processing test...');
            
            try {
                const qrDataString = JSON.stringify(testPetData);
                
                // Generate QR code
                await QRCode.toCanvas(canvas, qrDataString, {
                    width: 300,
                    margin: 2,
                    errorCorrectionLevel: 'H'
                });
                
                log(testId, 'Testing enhanced processing strategies...');
                
                // Test enhanced processing like our scanner
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Strategy 1: Original
                let code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'attemptBoth'
                });
                
                if (code) {
                    log(testId, 'Original image strategy succeeded', 'success');
                } else {
                    log(testId, 'Original image strategy failed', 'error');
                }
                
                // Strategy 2: Contrast enhancement
                const enhancedData = new Uint8ClampedArray(imageData.data);
                const contrast = 2.0;
                const brightness = 20;
                
                for (let i = 0; i < enhancedData.length; i += 4) {
                    // Convert to grayscale and enhance
                    const gray = (enhancedData[i] * 0.299 + enhancedData[i + 1] * 0.587 + enhancedData[i + 2] * 0.114);
                    const enhanced = Math.min(255, Math.max(0, (gray - 128) * contrast + 128 + brightness));
                    
                    enhancedData[i] = enhanced;
                    enhancedData[i + 1] = enhanced;
                    enhancedData[i + 2] = enhanced;
                }
                
                const enhancedCode = jsQR(enhancedData, imageData.width, imageData.height, {
                    inversionAttempts: 'attemptBoth'
                });
                
                if (enhancedCode) {
                    log(testId, 'Enhanced contrast strategy succeeded', 'success');
                } else {
                    log(testId, 'Enhanced contrast strategy failed', 'error');
                }
                
                // Strategy 3: Multi-scale
                const scales = [0.5, 0.75, 1.0, 1.25, 1.5];
                let scaleSuccess = 0;
                
                for (const scale of scales) {
                    const scaledWidth = Math.floor(canvas.width * scale);
                    const scaledHeight = Math.floor(canvas.height * scale);
                    
                    if (scaledWidth > 0 && scaledHeight > 0) {
                        const scaledCanvas = document.createElement('canvas');
                        scaledCanvas.width = scaledWidth;
                        scaledCanvas.height = scaledHeight;
                        const scaledCtx = scaledCanvas.getContext('2d');
                        
                        scaledCtx.drawImage(canvas, 0, 0, scaledWidth, scaledHeight);
                        const scaledImageData = scaledCtx.getImageData(0, 0, scaledWidth, scaledHeight);
                        
                        const scaledCode = jsQR(scaledImageData.data, scaledImageData.width, scaledImageData.height);
                        
                        if (scaledCode) {
                            scaleSuccess++;
                        }
                    }
                }
                
                log(testId, `Multi-scale test: ${scaleSuccess}/5 scales succeeded`, 
                    scaleSuccess > 0 ? 'success' : 'error');
                
                const totalSuccess = (code ? 1 : 0) + (enhancedCode ? 1 : 0) + (scaleSuccess > 0 ? 1 : 0);
                log(testId, `Enhanced processing complete: ${totalSuccess}/3 strategies succeeded`, 
                    totalSuccess > 0 ? 'success' : 'error');
                
                return totalSuccess > 0;
                
            } catch (error) {
                log(testId, `Enhanced processing test failed: ${error.message}`, 'error');
            }
            
            return false;
        }

        // Auto-run all tests on page load
        window.onload = async function() {
            console.log('Starting comprehensive QR scanner tests...');
            
            setTimeout(async () => {
                await runDetectionTest();
                setTimeout(async () => {
                    await runMultiStrategyTest();
                    setTimeout(async () => {
                        await runEnhancedTest();
                        console.log('All QR scanner tests completed');
                    }, 1000);
                }, 1000);
            }, 1000);
        };
    </script>
</body>
</html>
